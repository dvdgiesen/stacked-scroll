name: Deploy Live Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Demo Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Assemble static GitHub Pages bundle
        run: |
          mkdir -p _site/demo/assets _site/assets _site/dist _site/node_modules/gsap/dist
          cp -r demo/assets/* _site/demo/assets/
          cp -r demo/assets/* _site/assets/
          cp demo/index.html _site/demo/index.html
          sed 's|\.\./node_modules/|./node_modules/|g; s|\.\./dist/|./dist/|g' demo/index.html > _site/index.html
          cp -r dist/* _site/dist/
          cp node_modules/gsap/dist/gsap.min.js _site/node_modules/gsap/dist/
          cp node_modules/gsap/dist/ScrollTrigger.min.js _site/node_modules/gsap/dist/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
