<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PagedScroll adjacent-short regression fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }

    .panel {
      min-height: 40vh;
      border-bottom: 2px solid #000;
      background: #f5f5f5;
    }

    .panel:nth-child(even) { background: #e9e9e9; }

    .header {
      position: sticky;
      top: 0;
      padding: 1rem;
      background: #fff;
      border-bottom: 1px solid #ccc;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .main {
      padding: 1rem;
      min-height: 30vh;
    }

    nav {
      position: fixed;
      top: 0;
      right: 0;
      padding: 1rem;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <nav>
    <button onclick="scroller.scrollTo('a')">A</button>
    <button onclick="scroller.scrollTo('b')">B</button>
    <button onclick="scroller.scrollTo('c')">C</button>
  </nav>

  <section class="panel" id="a">
    <header class="header">Panel A</header>
    <main class="main">First short panel.</main>
  </section>

  <section class="panel" id="b">
    <header class="header">Panel B</header>
    <main class="main">Second short panel, adjacent to A.</main>
  </section>

  <section class="panel" id="c">
    <header class="header">Panel C</header>
    <main class="main">
      Tall panel to provide scroll room away from the adjacent short pair.
      <div style="height: 150vh;"></div>
    </main>
  </section>

  <script src="/node_modules/gsap/dist/gsap.min.js"></script>
  <script src="/node_modules/gsap/dist/ScrollTrigger.min.js"></script>
  <script src="../../dist/paged-scroll.umd.cjs"></script>
  <script>
    function initScroller() {
      if (typeof window.gsap === 'undefined' || typeof window.ScrollTrigger === 'undefined' || typeof window.PagedScroll === 'undefined') {
        setTimeout(initScroller, 50);
        return;
      }
      window.scroller = new PagedScroll({
        sections: '.panel',
        headerSelector: '.header',
        mainSelector: '.main'
      }).init();
    }
    initScroller();
  </script>
</body>
</html>
