<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PagedScroll demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    .panel {
      min-height: 100vh;
      border-bottom: 2px solid #000;
      background: #f5f5f5;
    }
    .panel:nth-child(even) { background: #e5e5e5; }
    .header {
      position: sticky;
      top: 0;
      padding: 1rem;
      background: #fff;
      border-bottom: 1px solid #ccc;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .main { padding: 1rem; }
    .short { min-height: 60vh; }
  </style>
</head>
<body>
  <nav style="position: fixed; top: 0; right: 0; padding: 1rem; z-index: 100;">
    <button onclick="scroller.scrollTo('intro')">Intro</button>
    <button onclick="scroller.scrollTo('work')">Work</button>
    <button onclick="scroller.scrollTo('contact')">Contact</button>
  </nav>

  <section class="panel" id="intro">
    <header class="header">Intro</header>
    <main class="main">
      <p>This panel is tall — scroll through its content first, then the next panel will slide over it.</p>
      <div style="height: 150vh;"></div>
    </main>
  </section>

  <section class="panel" id="work">
    <header class="header">Work</header>
    <main class="main">
      <p>This panel is also tall.</p>
      <div style="height: 120vh;"></div>
    </main>
  </section>

  <section class="panel short" id="contact">
    <header class="header">Contact</header>
    <main class="main">
      <p>This panel is shorter than the viewport. The spacer at the end of the document lets it scroll flush to the top.</p>
    </main>
  </section>

  <script type="module">
    import { PagedScroll } from '../src/index.js';

    window.scroller = new PagedScroll({
      sections: '.panel',
      headerSelector: '.header',
      mainSelector: '.main'
    }).init();
  </script>
</body>
</html>
